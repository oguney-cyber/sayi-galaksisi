<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sayı Galaksisi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sayı Galaksisi">
<meta name="theme-color" content="#141A3D">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>/* Sayı Galaksisi — space-adventure math game for a 5th grader on iPad.
   Layout: one full-screen app; each screen is an absolutely positioned layer. Single dark "deep space" look by design. */
:root {
  --space: #141A3D; --space-deep: #0B0F2E; --panel: #1E2657; --panel-2: #29336F; --line: #3B4892;
  --ink: #F5F7FF; --muted: #B3BBE6; --dim: #7E88C4; --navy: #10163A;
  --teal: #3ED6C4; --coral: #FF7A59; --sun: #FFC94A; --violet: #9D84FF; --pink: #FF6FAE; --lime: #9BE15D; --sky: #59B8FF;
  --good: #4BE08C; --warn: #FFB547;
  --p0: #3ED6C4; --p1: #FFC94A; --p2: #FF7A59; --p3: #9D84FF; --p4: #FF6FAE; --p5: #59B8FF; /* birler … yüz binler */
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Segoe UI Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(120% 80% at 80% 0%, #2A2270 0%, #171D48 50%, #0E1236 100%) fixed, var(--space); color: var(--ink); font-family: var(--font); -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
button { font-family: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
input { font-family: inherit; }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#app { position: relative; z-index: 1; height: 100%; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; animation: screenIn .28s ease-out; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- buttons ---------- */
.btn { --b: var(--sun); --s: #C7962C; --c: var(--navy);
  font: 800 20px/1.1 var(--font); border: 0; border-radius: 18px; padding: 16px 26px; color: var(--c); background: var(--b);
  box-shadow: 0 5px 0 var(--s); cursor: pointer; letter-spacing: .2px; transition: transform .07s, box-shadow .07s, filter .2s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--s); }
.btn:focus-visible, .choice:focus-visible, .key:focus-visible, .node:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
.btn.teal { --b: var(--teal); --s: #23A091; }
.btn.coral { --b: var(--coral); --s: #C9563C; }
.btn.violet { --b: var(--violet); --s: #6E57CC; --c: #fff; }
.btn.good { --b: var(--good); --s: #2BA463; }
.btn.warn { --b: var(--warn); --s: #C7852B; }
.btn.ghost { --b: var(--panel-2); --s: #151B47; --c: var(--ink); }
.btn.big { font-size: 24px; padding: 20px 34px; border-radius: 22px; }
.btn.wide { width: 100%; }
.btn[disabled] { --b: #343D72; --s: #232A5A; --c: #8189BE; cursor: default; }
.btn[disabled]:active { transform: none; box-shadow: 0 5px 0 var(--s); }
.iconbtn { width: 52px; height: 52px; border-radius: 16px; border: 0; background: var(--panel); color: var(--ink); display: grid; place-items: center;
  box-shadow: 0 4px 0 #11173F; cursor: pointer; flex: none; }
.iconbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #11173F; }
.iconbtn svg { width: 28px; height: 28px; }

/* ---------- HUD / home ---------- */
.hud { display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; position: relative; z-index: 3;
  background: linear-gradient(var(--space) 70%, transparent); }
.hud .grow { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border-radius: 999px; padding: 8px 14px 8px 10px;
  font-weight: 900; font-size: 19px; font-variant-numeric: tabular-nums; }
.chip svg { width: 26px; height: 26px; }
.chip.dead { color: var(--dim); }
.ring { position: relative; width: 52px; height: 52px; flex: none; }
.ring svg { width: 52px; height: 52px; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 900; }
.hero { display: flex; align-items: center; gap: 18px; max-width: 720px; margin: 6px auto 4px; padding: 18px; border-radius: 28px;
  background: linear-gradient(135deg, #2B2470, #1C3C78); position: relative; overflow: hidden; }
.hero .pi { width: 120px; flex: none; }
.hero h1 { margin: 0 0 4px; font-size: clamp(24px, 3.6vw, 32px); line-height: 1.1; text-wrap: balance; }
.hero p { margin: 0 0 12px; color: var(--muted); font-size: 17px; font-weight: 700; }
.hero .rocket { position: absolute; right: -14px; top: -18px; width: 130px; opacity: .9; pointer-events: none; }
.quick { display: flex; gap: 12px; max-width: 720px; margin: 12px auto; flex-wrap: wrap; }
.quick .card { flex: 1 1 200px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; border: 0; color: var(--ink);
  background: var(--panel); box-shadow: 0 5px 0 #11173F; text-align: left; cursor: pointer; font-weight: 800; font-size: 18px; }
.quick .card:active { transform: translateY(4px); box-shadow: 0 1px 0 #11173F; }
.quick .card small { display: block; color: var(--muted); font-weight: 700; font-size: 14px; margin-top: 2px; }
.quick .card .ic { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.quick .card .ic svg { width: 30px; height: 30px; }

.world { max-width: 720px; margin: 26px auto 8px; }
.world-head { display: flex; align-items: center; gap: 14px; border-radius: 26px; padding: 12px 18px 12px 12px; position: relative;
  background: linear-gradient(120deg, var(--wm), #1A2150 75%); border: 2px solid var(--wb); }
.world-head .planet { width: 104px; height: 104px; flex: none; }
.world-head h2 { margin: 0; font-size: 25px; line-height: 1.1; }
.world-head p { margin: 4px 0 0; color: var(--muted); font-weight: 700; font-size: 15px; }
.world-head .wbar { height: 10px; border-radius: 10px; background: rgba(0,0,0,.3); margin-top: 8px; overflow: hidden; max-width: 240px; }
.world-head .wbar i { display: block; height: 100%; background: var(--wc); border-radius: 10px; }
.world-tools { display: flex; gap: 10px; margin: 12px 0 0; flex-wrap: wrap; }
.path { display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 26px 0 10px; }
.nodewrap { position: relative; display: flex; align-items: center; transform: translateX(var(--dx, 0px)); }
.node { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; background: var(--wc); border: 0; cursor: pointer;
  box-shadow: 0 7px 0 var(--wd), inset 0 -6px 0 rgba(0,0,0,.14); color: var(--navy); position: relative; }
.node svg { width: 38px; height: 38px; }
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--wd); }
.node.locked { background: #343D74; color: #727CB6; box-shadow: 0 7px 0 #232A5A; cursor: default; }
.node.done { background: var(--wc); }
.node.current { animation: bob 1.8s ease-in-out infinite; }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 4px solid var(--wc); opacity: .7; animation: pulse 1.8s ease-out infinite; }
.nodelabel { position: absolute; left: 96px; white-space: nowrap; font-weight: 800; font-size: 16px; color: var(--muted); }
.nodewrap.flip .nodelabel { left: auto; right: 96px; text-align: right; }
.nodelabel b { display: block; color: var(--ink); font-size: 17px; }
.nstars { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); display: flex; gap: 1px; }
.nstars svg { width: 20px; height: 20px; }
.startflag { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: #fff; color: var(--navy); font-weight: 900; font-size: 14px;
  padding: 6px 12px; border-radius: 12px; white-space: nowrap; animation: bob 1.8s ease-in-out infinite; letter-spacing: .6px; }
.startflag::after { content: ""; position: absolute; bottom: -7px; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: #fff; border-bottom: 0; }
.footnote { text-align: center; color: var(--dim); font-size: 13px; font-weight: 700; padding: 30px 16px 40px; }

/* ---------- lesson ---------- */
.lbar { display: flex; align-items: center; gap: 12px; padding-block: 12px 6px; }
.prog { flex: 1; height: 18px; border-radius: 12px; background: #2A3268; overflow: hidden; position: relative; }
.prog i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--teal), var(--good)); border-radius: 12px; transition: width .45s cubic-bezier(.3,1.4,.5,1); }
.prog i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.35); }
.combo { min-width: 64px; display: inline-flex; gap: 4px; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; color: var(--sun); opacity: 0; transition: opacity .2s; }
.combo.on { opacity: 1; }
.combo svg { width: 26px; height: 26px; }
.stage { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 10px 28px; -webkit-overflow-scrolling: touch; }
.prompt { font-size: clamp(22px, 3.1vw, 30px); font-weight: 800; text-align: center; max-width: 780px; line-height: 1.28; text-wrap: balance; margin: 4px 0 0; }
.prompt .hl { color: var(--sun); }
.prompt small { display: block; font-size: .62em; color: var(--muted); font-weight: 700; margin-top: 6px; }
.badge { display: inline-block; padding: 4px 14px; border-radius: 999px; font-weight: 900; font-size: 18px; letter-spacing: .5px; color: var(--navy); }
.visual { width: 100%; display: flex; justify-content: center; }
.visual svg { max-width: 100%; height: auto; }
.lfoot { display: flex; align-items: flex-end; gap: 12px; padding-block: 8px calc(12px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 2; }
.lfoot .pi { width: 92px; flex: none; margin-bottom: -4px; }
.bubble { flex: 1; min-width: 0; background: #fff; color: var(--navy); border-radius: 20px; padding: 12px 16px; font-size: 18px; font-weight: 800; line-height: 1.3;
  position: relative; align-self: center; min-height: 52px; display: flex; align-items: center; gap: 10px; }
.bubble::before { content: ""; position: absolute; left: -10px; bottom: 16px; border: 10px solid transparent; border-right-color: #fff; border-left: 0; }
.bubble .txt { flex: 1; min-width: 0; }
.bubble:empty { visibility: hidden; }
.spk { width: 44px; height: 44px; border-radius: 14px; border: 0; background: #EEF0FF; color: #3B3FA0; display: grid; place-items: center; flex: none; cursor: pointer; }
.spk svg { width: 26px; height: 26px; }
.spk.on { animation: pulse2 1s ease-in-out infinite; }
.lfoot .btn { flex: none; min-width: 150px; align-self: center; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.9,.3,1.15);
  border-radius: 28px 28px 0 0; padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet.show { transform: none; }
.sheet.good { background: #15433F; border-top: 5px solid var(--good); }
.sheet.bad { background: #4A2A3C; border-top: 5px solid var(--warn); }
.sheet.info { background: #2A2F6E; border-top: 5px solid var(--violet); }
.sheet .in { max-width: 820px; margin: 0 auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.sheet .msg { flex: 1 1 300px; min-width: 0; }
.sheet h3 { margin: 0 0 4px; font-size: 28px; }
.sheet.good h3 { color: var(--good); }
.sheet.bad h3 { color: var(--warn); }
.sheet p { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.35; color: #E9ECFF; }
.sheet .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet .solution { margin-top: 10px; display: flex; justify-content: flex-start; }

/* ---------- keypad / number ---------- */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(310px, 92vw); flex: none; }
.key { height: 62px; font: 900 30px/1 var(--font); border-radius: 16px; border: 0; background: var(--panel-2); color: var(--ink); box-shadow: 0 5px 0 #151B47; cursor: pointer; }
.key:active { transform: translateY(4px); box-shadow: 0 1px 0 #151B47; }
.key.ok { background: var(--good); color: var(--navy); box-shadow: 0 5px 0 #2BA463; }
.key.del { font-size: 24px; }
.ansrow { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 28px; font-weight: 800; }
.ansbox { min-width: 110px; height: 76px; border-radius: 18px; background: #0E1436; border: 3px solid var(--line); font: 900 42px/1 var(--font);
  display: inline-flex; align-items: center; justify-content: center; padding: 0 16px; letter-spacing: 1px; font-variant-numeric: tabular-nums; color: var(--ink); cursor: pointer; }
.ansbox.sm { min-width: 70px; height: 62px; font-size: 34px; }
.ansbox.active { border-color: var(--sun); box-shadow: 0 0 0 5px rgba(255,201,74,.18); }
.ansbox.active:empty::after, .ansbox.active.caret::after { content: ""; width: 3px; height: 38px; background: var(--sun); animation: blink 1s steps(1) infinite; margin-left: 2px; }
.ansbox.ok { border-color: var(--good); background: #143B37; }
.ansbox.bad { border-color: var(--warn); animation: shake .4s; }
.fracin { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
.fracin .bar { width: 86px; height: 5px; border-radius: 3px; background: var(--ink); }

/* ---------- choices ---------- */
.choices { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 14px; width: min(740px, 100%); }
.choice { background: var(--panel); border: 3px solid var(--line); border-radius: 22px; padding: 14px; color: var(--ink); cursor: pointer;
  font: 800 26px/1.2 var(--font); box-shadow: 0 5px 0 #10163E; min-height: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; transition: border-color .15s, background .15s; }
.choice:active { transform: translateY(4px); box-shadow: 0 1px 0 #10163E; }
.choice svg { max-width: 100%; height: auto; }
.choice small { font-size: 16px; color: var(--muted); font-weight: 800; }
.choice.right { border-color: var(--good); background: #17463F; }
.choice.wrong { border-color: var(--warn); background: #43283A; animation: shake .4s; }
.choice.dim { opacity: .45; }
.choice.sym { font-size: 46px; }

/* ---------- digit tiles / order ---------- */
.digits { display: flex; align-items: flex-end; justify-content: center; gap: 8px; flex-wrap: wrap; }
.dtile { width: 66px; height: 88px; border-radius: 18px; border: 3px solid var(--line); background: var(--panel); color: var(--ink); font: 900 52px/1 var(--font);
  display: grid; place-items: center; cursor: pointer; box-shadow: 0 5px 0 #10163E; position: relative; }
.dtile:active { transform: translateY(4px); box-shadow: 0 1px 0 #10163E; }
.dtile.right { border-color: var(--good); background: #17463F; }
.dtile.wrong { border-color: var(--warn); animation: shake .4s; }
.dtile.mark { border-color: var(--sun); }
.dtile .pl { position: absolute; bottom: -26px; font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.dgap { width: 14px; }
.tiles { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.tile { min-width: 120px; padding: 16px 18px; border-radius: 20px; background: var(--panel); border: 3px solid var(--line); color: var(--ink);
  font: 900 30px/1 var(--font); box-shadow: 0 5px 0 #10163E; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.tile.used { opacity: .5; border-color: var(--sun); }
.tile .ord { position: absolute; top: -12px; right: -10px; width: 30px; height: 30px; border-radius: 50%; background: var(--sun); color: var(--navy);
  font-size: 17px; display: grid; place-items: center; }
.slots { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 30px; font-weight: 900; color: var(--muted); }
.slot { min-width: 110px; height: 64px; border-radius: 16px; border: 3px dashed var(--line); display: grid; place-items: center; color: var(--ink); padding: 0 10px; }
.slot.filled { border-style: solid; border-color: var(--sun); }

/* ---------- column arithmetic ---------- */
.colwrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.colgrid { display: grid; gap: 6px 8px; align-items: end; }
.colhead { font-size: 13px; font-weight: 900; text-align: center; padding: 4px 2px; border-radius: 10px; color: var(--navy); letter-spacing: .3px; }
.cc { width: 70px; height: 76px; display: grid; place-items: center; font: 900 48px/1 var(--font); position: relative; font-variant-numeric: tabular-nums; }
.cc.op { color: var(--muted); }
.cc.top.can { cursor: pointer; border-radius: 16px; background: rgba(255,255,255,.05); border: 2px dashed rgba(255,255,255,.22); }
.cc.top.need { border-color: var(--warn); background: rgba(255,181,71,.12); }
.cc .cur { position: relative; }
.cc .cur.changed { color: var(--coral); }
.cc .was { position: absolute; top: -6px; right: 2px; font-size: 22px; color: var(--muted); text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: var(--coral); }
.cc .was2 { position: absolute; top: -6px; left: 2px; font-size: 18px; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--coral); }
.carry { width: 70px; height: 34px; display: grid; place-items: center; font: 900 24px/1 var(--font); color: var(--sky); border-radius: 10px; cursor: pointer; }
.carry.slot1 { border: 2px dashed rgba(89,184,255,.35); }
.colline { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--ink); }
.cc.ans { background: #0E1436; border: 3px solid var(--line); border-radius: 16px; cursor: pointer; }
.cc.ans.active { border-color: var(--sun); box-shadow: 0 0 0 5px rgba(255,201,74,.18); }
.cc.ans.ok { border-color: var(--good); background: #143B37; }
.cc.ans.bad { border-color: var(--warn); animation: shake .4s; }
.flytok { position: fixed; z-index: 50; font: 900 26px/1 var(--font); color: var(--navy); background: var(--sun); border-radius: 12px; padding: 6px 10px; pointer-events: none;
  transition: transform .7s cubic-bezier(.4,1.6,.5,1), opacity .3s .5s; }
.blockstrip { display: flex; gap: 8px; justify-content: center; align-items: flex-end; }
.bcol { min-width: 70px; min-height: 56px; display: flex; flex-wrap: wrap-reverse; gap: 3px; justify-content: center; align-content: flex-start; max-width: 120px; }
.bcol svg { display: block; }
.bcol .newb { animation: popin .45s cubic-bezier(.3,1.6,.5,1) backwards; }

/* ---------- blocks builder ---------- */
.bbuild { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; width: min(760px, 100%); }
.bplace { background: var(--panel); border-radius: 22px; padding: 10px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; border-top: 6px solid var(--pc); }
.bplace h4 { margin: 0; font-size: 16px; color: var(--pc); }
.bplace .area { min-height: 150px; width: 100%; display: flex; flex-wrap: wrap-reverse; align-content: flex-start; justify-content: center; gap: 3px; }
.bplace .cnt { font: 900 34px/1 var(--font); }
.bplace .pm { display: flex; gap: 8px; }
.bplace .pm button { width: 52px; height: 48px; border-radius: 14px; border: 0; font: 900 28px/1 var(--font); background: var(--panel-2); color: var(--ink); box-shadow: 0 4px 0 #151B47; cursor: pointer; }
.bplace .pm button:active { transform: translateY(3px); box-shadow: 0 1px 0 #151B47; }
.bplace .pm button.plus { background: var(--pc); color: var(--navy); box-shadow: 0 4px 0 rgba(0,0,0,.4); }
.trade { animation: tradeFlash .7s ease-out; }

/* ---------- misc visuals ---------- */
.svgbox { width: min(680px, 100%); }
.svgbox svg { width: 100%; height: auto; display: block; }
.angle-svg { touch-action: none; }
.hint { color: var(--muted); font-weight: 800; font-size: 16px; text-align: center; }
.readout { font: 900 30px/1 var(--font); display: flex; gap: 12px; align-items: center; justify-content: center; }
.readout .badge { font-size: 20px; }
.storybox { width: min(780px, 100%); background: var(--panel); border-radius: 24px; padding: 18px 20px; font-size: 23px; font-weight: 800; line-height: 1.4; position: relative; border-left: 8px solid var(--pink); }
.storybox .q { color: var(--sun); display: block; margin-top: 6px; }
.opgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: min(760px, 100%); }
.opgrid .choice { min-height: 120px; }
.opgrid .choice b { font-size: 50px; line-height: 1; }
.teachbox { width: min(820px, 100%); display: flex; flex-direction: column; align-items: center; gap: 16px; }
.teachbox h2 { margin: 0; font-size: clamp(24px, 3.4vw, 32px); text-align: center; text-wrap: balance; }
.bigeq { font: 900 clamp(34px, 6vw, 56px)/1.1 var(--font); text-align: center; letter-spacing: 1px; }

@keyframes shineSweep { to { left: 100%; } }
.prog.hot i { background: linear-gradient(90deg, #FFC94A, #FF7A59); box-shadow: 0 0 14px rgba(255,160,60,.6); }
.combo.bump { animation: comboBump .45s cubic-bezier(.3,1.8,.5,1); }
@keyframes comboBump { 0% { transform: scale(1); } 40% { transform: scale(1.45) rotate(-6deg); } 100% { transform: scale(1); } }
.bpart { position: absolute; width: 12px; height: 12px; border-radius: 4px; z-index: 30; pointer-events: none; animation: bpart .8s cubic-bezier(.15,.8,.3,1) forwards; }
@keyframes bpart { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(220deg) scale(1); opacity: 0; } }
.sheet.good h3 { animation: okPop .5s cubic-bezier(.3,1.8,.5,1) .05s backwards; }
@keyframes okPop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet.show .acts .btn { animation: fadeUp .3s .12s backwards; }
@media (prefers-reduced-motion: reduce) { .cardin, .stage.shake, .prog.shine::before, .combo.bump, .sheet.good h3 { animation: none !important; } }

.hardchips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 640px; }
.hardchips span { background: var(--panel); border: 3px solid var(--violet); border-radius: 16px; padding: 10px 18px; font: 900 clamp(24px, 4vw, 34px)/1 var(--font); color: var(--ink); box-shadow: 0 4px 0 #2A2F6E; }

html, body { height: 100%; }
#app { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
</style>

    return { v: 1, name: '', piColor: 'teal', xp: 0, stars: 0, streak: { n: 0, last: null }, today: { d: null, xp: 0, ms: 0 }, goal: 30,
      lessons: {}, facts: {}, mistakes: [], owned: ['teal'], wear: {}, speedBest: 0, days: {}, reviewDay: null, created: Date.now(),

/* Lesson runner: teach scenes, questions with two tries, feedback sheets, combos, results. */
const Facts = {
  key: (a, b) => Math.min(a, b) + 'x' + Math.max(a, b),
  get(a, b) { return Store.data.facts[this.key(a, b)] || { box: 0, seen: 0, ok: 0, ms: 0, last: 0, up: 0 }; },
  update(a, b, ok, ms) {
    const k = this.key(a, b), f = Object.assign({}, this.get(a, b)); const now = Date.now();
    f.seen++;
    if (ok) {
      f.ok++;
      const fast = ms < 5000, spaced = f.box < 2 || now - (f.up || 0) > 10 * 3600 * 1000;
      if (fast && spaced) { f.box = Math.min(5, f.box + 1); f.up = now; }
    } else f.box = Math.max(0, f.box - 2);
    f.ms = f.ms ? Math.round(f.ms * 0.7 + ms * 0.3) : ms; f.last = now;
    Store.data.facts[k] = f;
  },
  status(a, b) { const f = this.get(a, b); if (!f.seen) return 'new'; if (f.box >= 4) return 'strong'; if (f.box >= 2) return 'learning'; return 'weak'; },
  weight(a, b) { const f = this.get(a, b); const hrs = (Date.now() - (f.last || 0)) / 3600000; return (6 - f.box) * (1 + Math.min(hrs, 96) / 24) + (f.seen ? 0 : 2); },
  pick(pairs, n) {
    const out = []; let pool = pairs.slice();
    while (out.length < n && pool.length) {
      const ws = pool.map(([a, b]) => this.weight(a, b)), tot = ws.reduce((s, x) => s + x, 0); let r = Math.random() * tot, i = 0;
      while (r > ws[i] && i < ws.length - 1) { r -= ws[i]; i++; }
      out.push(pool[i]); pool.splice(i, 1); if (!pool.length && out.length < n) pool = pairs.slice();
    }
    return out;
  },
};

/* WORLD 2 — Yuvarlama Tepesi: rounding to tens/hundreds with the "hill" model, which digit decides, estimation */
const roundTo = (n, p) => Math.floor(n / p + 0.5) * p;
const RW = { 10: 'onluğa', 100: 'yüzlüğe', 1000: 'binliğe' };
const RCOL = { 10: 'var(--sun)', 100: 'var(--coral)', 1000: 'var(--violet)' };
function notRound(lo, hi, p) { let n; do { n = rnd(lo, hi); } while (n % p === 0); return n; }
function hillQ(place, n) {
  const lo = Math.floor(n / place) * place, mid = lo + place / 2, r = roundTo(n, place);
  const atMid = n === mid;
  return { kind: 'hill', n, place, prompt: atMid ? `${hl(fmt(n))} tam tepede! En yakın ${RW[place]} yuvarlanınca kaç olur?` : `${hl(fmt(n))} hangi ${place === 10 ? 'onluğa' : 'yüzlüğe'} daha yakın?<small>Top tepenin hangi yanında?</small>`,
    say: atMid ? `${n} tam tepede! En yakın ${RW[place]} yuvarlanınca kaç olur?` : `${n} sayısı, en yakın ${RW[place]} yuvarlanınca kaç olur? Top tepenin hangi yanında?`, answer: r,
    hint: atMid ? 'Top tam tepede durursa ileri, yani yukarı yuvarlanır.' : `Tepenin tam ortası ${fmt(mid)}. Top ortadan önceyse sola, ortada ya da sonrasındaysa sağa yuvarlanır.`,
    explain: atMid ? `${fmt(n)} tam tepede. Tam ortadaki sayı yukarı yuvarlanır: ${fmt(r)}.` : n > mid ? `${fmt(n)}, tepenin ortası olan ${TR.N(mid, 'abl')} büyük. Yukarı yuvarlanır: ${fmt(r)}.` : `${fmt(n)}, tepenin ortası olan ${TR.N(mid, 'abl')} küçük. Aşağı yuvarlanır: ${fmt(r)}.` };
}
function roundNumQ(place, n, scaffold) {
  const r = roundTo(n, place), look = place === 10 ? 'birler' : place === 100 ? 'onlar' : 'yüzler';
  const ld = Math.floor(n / (place / 10)) % 10;
  return { kind: 'number', prompt: `${badge(RW[place].toLocaleUpperCase('tr') + ' YUVARLA', RCOL[place])}<br>${fmt(n)} → ?`, say: `${n} sayısını en yakın ${RW[place]} yuvarla.`, answer: r,
    visual: scaffold ? digitRow(n, { target: Math.log10(place), look: Math.log10(place) - 1 }) : null,
    hint: `${cap(RW[place])} yuvarlarken ${look} basamağına bakarız. ${cap(look)} rakamı 5 ya da daha büyükse yukarı, 4 ya da daha küçükse aşağı.`,
    diagnose: (g) => (g === roundTo(n, place === 10 ? 100 : 10) ? `Bu, ${place === 10 ? 'yüzlüğe' : 'onluğa'} yuvarlanmış hali. Soruda ${RW[place]} yuvarla diyor.` : null),
    explain: `${cap(look)} rakamı ${ld}, yani ${ld >= 5 ? '5 ya da daha büyük. Yukarı' : '5’ten küçük. Aşağı'} yuvarlanır: ${fmt(r)}.` };
}

/* WORLD 6 — Kesir Pizzacısı: equal parts, numerator/denominator, comparing (magnitude), number line, equivalence, fraction of a set, mixed numbers */
const FIN = (a, b) => `<span class="fracin">${a}<span class="bar"></span>${b}</span>`;
const possS = (n) => TR.suf(TR.num(n), 'poss');
function scattered(n, k) { return shuffle(range(n)).slice(0, k); }
function groupsSVG(groups, each, hlCount = 0) {
  const per = Math.ceil(Math.sqrt(each)), cell = 22, bw = per * cell + 16, bh = Math.ceil(each / per) * cell + 16, cols = Math.min(groups, 6), rows = Math.ceil(groups / cols);
  let s = '';
  for (let g = 0; g < groups; g++) {
    const gx = (g % cols) * (bw + 12) + 4, gy = Math.floor(g / cols) * (bh + 12) + 4;
    s += `<rect x="${gx}" y="${gy}" width="${bw}" height="${bh}" rx="14" fill="${g < hlCount ? 'rgba(255,201,74,.25)' : 'rgba(255,255,255,.05)'}" stroke="${g < hlCount ? '#FFC94A' : 'rgba(255,255,255,.3)'}" stroke-width="3"/>`;
    for (let i = 0; i < each; i++) s += `<circle cx="${gx + 8 + (i % per) * cell + cell / 2}" cy="${gy + 8 + Math.floor(i / per) * cell + cell / 2}" r="8" fill="#FF7A59" stroke="#10163A" stroke-width="2"/>`;
  }
  return svgWrap(cols * (bw + 12) + 8, rows * (bh + 12) + 8, s);
}
function mixedVisual(w, r, d) {
  let out = ''; for (let i = 0; i < w; i++) out += fracSVG(d, range(d), 'circle', { r: 50 });
  out += fracSVG(d, range(r), 'circle', { r: 50 });
  return `<div class="row" style="justify-content:center;gap:10px">${out}</div>`;
}

/* ---------- daily mixed review (spaced + interleaved) ---------- */
Screens.review = () => {
  const d = Store.data;
  const done = WORLDS.flatMap((w) => w.lessons).filter(lessonDone);
  if (done.length < 2) { toast('İki görev bitirince açılır.'); return; }
  const w8 = done.map((l) => { const r = d.lessons[l.id]; const days = (Date.now() - r.last) / 86400000; return { l, w: (4 - r.best) * 2 + Math.min(days, 7) + (100 - (r.acc || 0)) / 25 }; });
  const pickL = () => { const tot = w8.reduce((s, x) => s + x.w, 0); let r = Math.random() * tot; for (const x of w8) { r -= x.w; if (r <= 0) return x.l; } return w8[0].l; };
  const items = [];
  for (let i = 0; i < 8; i++) {
    const l = pickL(); const gens = l.steps.map((s, si) => [s, si]).filter(([s]) => s.gen && !s.bonus); const [st, si] = pick(gens);
    const wl = WORLDS.find((w) => w.lessons.includes(l)); const seeded = wl && SEED.worlds.includes(wl.id);
    if (seeded) items.push({ gen: st.gen, src: l.id, seedKey: l.id + ':' + si, i: rnd(0, (st.n || 1) - 1) });
    else items.push({ gen: (ctx) => st.gen(Object.assign({}, ctx, { i: rnd(1, 3) })), src: l.id });
  }
  if (Object.keys(d.facts).length) for (let i = 0; i < 2; i++) items.splice(rnd(0, items.length), 0, { gen: () => { const [a, b] = Facts.pick(factPairs((x, y) => x >= 2 && y >= 2), 1)[0]; return factQ(a, b); }, src: 'c-review' });
  const games = done.flatMap((l) => { const wl = WORLDS.find((w) => w.lessons.includes(l)); const sd = wl && SEED.worlds.includes(wl.id); return l.steps.map((s, si) => [s, si]).filter(([s]) => s.bonus).map(([s, si]) => ({ gen: s.gen, src: l.id, seedKey: sd ? l.id + ':' + si : null, i: 0 })); });
  if (games.length) items.push(Object.assign({}, pick(games), { bonus: true }));
  Player.run({ id: 'review', title: 'Karışık görev', world: lastWorld() || WORLDS[0].id, steps: [] }, { items, review: true });
};

        h('span', { class: 'gst', html: [0, 1, 2].map((i) => IC.star(i < best)).join('') })));
    }
  }
  scroll.append(grid);
  setTimeout(() => Voice.speak('Oyun salonuna hoş geldin! Bir oyun seç.'), 300);
};

'use strict';
function boot() {
  Store.load(); Voice.init(); starfield();
  if (!Store.data.name) Screens.onboard(); else Screens.home();
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden) { Voice.stop(); Store.save(); } });
  if (window.__PWA && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
